<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Apex Unfollowers</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <img src="../icons/icon32.png" alt="" width="24" height="24">
    <span class="brand">Apex Unfollowers</span>
    <bdi class="version" id="version"></bdi>
  </header>

  <main>
    <section class="card" id="card">
      <span class="dot" aria-hidden="true"></span>
      <div class="card-text" role="status">
        <strong id="title"></strong>
        <span id="text"></span>
      </div>
    </section>
  </main>

  <footer class="actions">
    <button id="action" class="btn primary" type="button" hidden></button>
    <div class="support-card" id="supportCard" hidden>
      <a class="support-link" id="supportLink" href="https://ko-fi.com/konradwozniak1996" target="_blank" rel="noopener noreferrer" aria-describedby="supportHint"></a>
      <span id="supportHint"></span>
    </div>
  </footer>

  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
