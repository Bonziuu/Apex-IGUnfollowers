# Apex Unfollowers – CI: każdy push i Pull Request.
# Instalacja zależności, Chromium dla Playwright, test end-to-end na symulowanym Instagramie
# i budowa paczki dla użytkownika.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test + paczka
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja zależności
        run: npm ci --no-audit --no-fund

      - name: Instalacja Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Składnia i manifest
        run: |
          # wszystkie pliki JS z repozytorium (bez listy na sztywno, żeby podział na moduły jej nie psuł)
          git ls-files '*.js' '*.mjs' | while read -r f; do node --check "$f" || exit 1; done
          # manifest: poprawny JSON i każdy plik, na który wskazuje, istnieje w repozytorium
          node tools/check-manifest.mjs

      - name: npm test
        run: npm test

      - name: Paczka dla użytkownika
        run: npm run package:release

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-Unfollowers
          path: dist/
